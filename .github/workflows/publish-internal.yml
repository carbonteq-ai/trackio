name: Publish CarbonTeq Trackio to the internal index

on:
  workflow_dispatch:
    inputs:
      source_run_id:
        description: Publish-workflow run that built the retained artifacts
        required: true
        type: string
      release_tag:
        description: Immutable carbonteq-v tag to publish
        required: true
        type: string

permissions:
  actions: read
  contents: read

jobs:
  publish-internal:
    runs-on: [self-hosted, linux, x64, lan-release]
    env:
      UV_SYSTEM_CERTS: "true"
      INTERNAL_UPLOAD_URL: https://pypi.lan/carbonteq/stable/
      INTERNAL_SIMPLE_URL: https://pypi.lan/carbonteq/stable/+simple/
    steps:
      - name: Checkout the immutable release tag
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ inputs.release_tag }}
          fetch-depth: 0

      - name: Validate the tag and retained build run
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          test "${RELEASE_TAG}" = "carbonteq-v${version}"
          test "$(git rev-list -n 1 "${RELEASE_TAG}")" = "$(git rev-parse HEAD)"
          source_sha="$(gh run view "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" --json headSha,conclusion --jq 'select(.conclusion == "failure" or .conclusion == "success") | .headSha')"
          test "${source_sha}" = "$(git rev-parse HEAD)"

      - name: Download and verify the retained distributions
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_RUN_ID: ${{ inputs.source_run_id }}
        run: |
          mkdir -p dist
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name carbonteq-trackio-python --dir dist
          uvx twine check dist/*
          sha256sum dist/* | tee internal-release-SHA256SUMS

      - name: Publish exact bytes to the stable internal index
        run: uv publish --publish-url "${INTERNAL_UPLOAD_URL}" dist/*

      - name: Prove a clean stable-index install
        run: |
          version="$(sed -n 's/^version = "\([^"]*\)"$/\1/p' pyproject.toml)"
          uv venv .internal-consumer --python 3.12
          uv pip install --python .internal-consumer/bin/python \
            --index-url "${INTERNAL_SIMPLE_URL}" "carbonteq-trackio==${version}"
          .internal-consumer/bin/python -c \
            'import importlib.metadata, trackio; assert importlib.metadata.version("carbonteq-trackio") == trackio.__version__'

      - name: Retain the internal publication receipt
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: carbonteq-trackio-internal-${{ inputs.release_tag }}
          path: internal-release-SHA256SUMS
          if-no-files-found: error
